<!-- Feedback & Kontakt-widget (Formspree) -->
    <section class="faq-section" id="feedback-section">
      <h2 class="faq-title">Tyck till eller hör av dig</h2>
      <p class="faq-body" style="padding-bottom: 1rem;">
        Hittade du något fel, har du ett förslag på förbättring eller vill du diskutera ett samarbete? Lämna gärna feedback direkt här!
      </p>
      
      <form id="feedback-form" class="feedback-form-card">
        <div class="feedback-btns-row">
          <button type="button" class="feedback-vote-btn" data-vote="Bra jobbat! 👍">Bra verktyg 👍</button>
          <button type="button" class="feedback-vote-btn" data-vote="Behöver förbättras 👎">Kan bli bättre 👎</button>
        </div>

        <div id="feedback-input-container" style="display: none; margin-top: 1rem;">
          <input type="hidden" name="vote" id="feedback-vote-input" value="">
          <textarea name="message" id="feedback-text-input" rows="3" class="feedback-textarea" placeholder="Skriv din kommentar, idé eller fråga här (valfritt)..." aria-label="Din feedback"></textarea>
          <input type="email" name="email" id="feedback-email-input" class="feedback-email-input" placeholder="Din e-post (om du vill ha svar)..." aria-label="Din e-postadress">
          <button type="submit" class="feedback-submit-btn">Skicka feedback</button>
        </div>

        <div id="feedback-success-msg" style="display: none; margin-top: 1rem; color: #166534; background: #DCFCE7; padding: 1rem; border-radius: 12px; font-size: 0.9rem; text-align: center; font-weight: 500;">
          Tack för din feedback! Den har skickats till Magnus. 🚀
        </div>
      </form>
    </section>
